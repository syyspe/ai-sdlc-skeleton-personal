name: Agent evals

# Regression-tests agent configuration (CLAUDE.md, .claude/**) the same way
# tests regression-test code. Runs whenever that configuration changes, on
# a weekly schedule to catch drift from model/tool updates, and on demand.
#
# Needs an ANTHROPIC_API_KEY secret (Settings → Secrets and variables →
# Actions) with access to the model you want evals to run against. Without
# it the job skips cleanly and says so in the run summary, so a fresh clone
# of the skeleton isn't red before you've opted in.

on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - "REVIEW.md"
      - ".claude/**"
      - "evals/**"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secrets can't be referenced from a step-level `if:`, so turn the
      # presence of the key into an output the later steps can gate on.
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Agent evals skipped"
              echo
              echo "No \`ANTHROPIC_API_KEY\` secret is set, so \`claude -p\` has"
              echo "nothing to authenticate with. Add one under **Settings →"
              echo "Secrets and variables → Actions** to turn these on."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install jq
        if: steps.key.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Claude Code
        if: steps.key.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run evals
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          chmod +x evals/run.sh
          ./evals/run.sh

      # TODO: publish pass rate as a PR comment / job summary, e.g. via
      # `echo "..." >> "$GITHUB_STEP_SUMMARY"`, once you have enough evals
      # for a rate to be meaningful.
