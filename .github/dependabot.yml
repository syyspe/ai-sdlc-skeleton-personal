# The workflow pins its actions to commit SHAs (a tag is mutable, a SHA is
# not). This is what keeps those pins from silently rotting: Dependabot
# opens a PR when a pinned action has a new release, and updates the
# trailing "# v1" comment along with the SHA.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
