# Stage 6 (Maintain) control bands.
#
# A deterministic monitoring script (not included here — it's specific to
# your metrics stack, e.g. a cron job or scheduled Claude session with
# read-only Bash/API access) watches each metric and responds according to
# which band its current value falls into.
#
#   1 sigma: log only, no action
#   2 sigma: Claude diagnoses — read-only tools (Bash inspection, log/metric
#            queries), writes findings, does not act
#   3 sigma: Claude may act — open a PR, or trigger a pre-approved runbook
#
# A breach past band 3 produces an intent/*.md file in the same format as a
# Stage 1 intent, with anomaly evidence, proposed outcome, affected systems,
# and open questions — closing the loop back to Stage 1.
#
# Fill in real thresholds per metric before relying on this.

metrics:
  ci_test_failure_rate:
    description: "Share of CI runs failing on main over a rolling window"
    window: "<e.g. 24h>"
    band_1: "<threshold>"
    band_2: "<threshold>"
    band_3: "<threshold>"

  post_deploy_5xx_rate:
    description: "5xx error rate in the N minutes after a production deploy"
    window: "<e.g. 30m post-deploy>"
    band_1: "<threshold>"
    band_2: "<threshold>"
    band_3: "<threshold>"

  pr_cycle_time:
    description: "Time from PR open to merge"
    window: "<e.g. 7d rolling median>"
    band_1: "<threshold>"
    band_2: "<threshold>"
    band_3: "<threshold>"

  # Add project-specific SLOs here.

routing:
  band_2_owner: "<who/what reviews Claude's diagnosis — e.g. on-call channel>"
  band_3_approval: "<who must approve before Claude acts — e.g. on-call engineer>"
  intent_output_dir: "intent/"
